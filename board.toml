# Board description of the Xiaomi Mi 8 SE (sirius, SDM710), read by the unixnu build driver.
#
# Format 2: the ARM64, SoC, OS and device layers merge, and this file only states what the
# board changes. The prelink roots, slide, early security initializer, IPSW identity and the
# Apple device-tree properties come from the selected OS profile
# (profiles/os/ipados-17.7.11-21H461/profile.toml of UniXNU); the GIC, timer and CPU topology
# come from the sdm710 SoC profile and dts/sirius.dts.

schema_version = 2

[board]
name = "sirius"
soc = "SDM710"
soc_source = "sdm710"
# iOS 26.5.2 (23F84) from the iPadOS 26.5.2 restore image, run on an arm64 kernel: this board
# has no pointer authentication, so there is no prelink either (the target kexts are arm64e).
os_profile = "ipados-26.5.2-23F84-arm64"
description = "Xiaomi Mi 8 SE"
kit = "sirius"

# ArmDTPlatform drives the platform expert from dts/sirius.dts. ArmCpu is the board's modified
# copy in drivers/ArmCpu (non-Apple timer INTID, /cpus probe counters, sheng-smp). DarwinBoot is
# the board's fork with the GIC-500 pre-configuration and the INTID 19 timer. XnuPrelink is the
# prelink kit the OS profile names. GopFramebuffer, AppleKeyStoreState and ShengHidInput drive
# the iOS userspace display, keystore state and touch input.
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState", "ShengHidInput"]

# The unchanged iPad7,1 iPadOS 17.7.11 restore image, the same target as fajita and sheng.
# SDM710 (Kryo 360, Cortex-A75/A55) is ARMv8.2 without pointer authentication, so it runs
# arm64 userlands only. The 21H461 kernelcache matches the XNU 23.6.0 source pinned by the
# OS profile and the prelink roots it selects.
# [ipsw] is not set here: the OS profile (profiles/os/ipados-26.5.2-23F84-arm64) carries
# the iPad17,3 iPadOS 26.5.2 23F84 restore image and the Apple identity the ADT reproduces.

[kernel]
defconfig = "sirius_ios26_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm710.config", "os:configs/ipados.config"]
# arch and OS only: the SoC and device series of the iPadOS 17 port patch xnu-10063 and do not
# apply to xnu-12377. The device adds its own 12377 patches deliberately.
patch_series = ["arch:patches/xnu/series", "os:patches/xnu/series"]
# build-xnu-12377.sh builds and links its own archives; the recipes of the iPadOS 17 port
# below are for the xnu-10063 build.
archives = []

[device_tree]
source = "device:dts/sirius.dts"
include_dirs = ["soc:dts"]

[userdata]
first_lba = 0x1080000              # 17301504
last_lba = 0x747BFDE               # 122142686
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
# trust_cache_sha256 is set once the 23F84 trust caches are extracted and bundled.
volume = "SIRIUSESP"
size_mib = 512                      # holds the kernel, trust cache, EFI binaries and optional 256 MiB RAM Data seed
loader = "payload"                  # not "firmware": unixnu.toml gets [[driver]] Payloads/DarwinBoot.efi
title = "sirius iOS 26.5.2 bring-up: arm64 xnu-12377 kernel"
dram_size = "0x17d6c0000"
panic_screen = true
# Bring-up probe without a console: the kernel waits this many seconds after the first call to
# entry_probe_reset_after inside _arm_init and then resets through PSCI, so the phone returns to
# fastboot on its own and the elapsed time reports how far the kernel got. The band probes of
# the entry patch stay in the image.
entry_probe_reset_delay = 8
entry_probe_reset_after = "_PE_init_platform"
# The OS profile's four fixups (a list here replaces the profile's), then one of this board's: without a
# Metal device CoreImage falls back to OpenGL, whose dispatch table is empty here, and iconservicesagent
# jumps to address 0 in CI::GLContext::init. The fifth entry replaces CoreUI's [CIContext
# contextWithOptions:] call in +[CUIShapeEffectStack sharedCIContext] (0x1a31d7b84 unslid, a bl) with
# mov x0, xzr: the shared context is nil, the glyph rasterizer returns no image and IconFoundation checks
# for that (cbz x26), so a vector symbol draws empty instead of killing the agent.
# text_fixups index the iPadOS 17 shared cache; the 23F84 fixups come from the lowering
# pipeline (docs/PORT-ios26.md, P4).
kernel_args = [
  "-v", "serial=3", "debug=0x14e",           # console on the USB transport, kernel debug mask
  "cpus=8", "sheng-smp=1",                   # ArmCpu claims every /cpus nub
  "armcpu-timer-intid=19",                   # SDM710 virtual timer is GIC PPI 3 (INTID 19)
  "armcpu-self-ipi=1",
  # The iPadOS 17 arguments (sirius-emmc, offline-legacy-*, sheng-staged-apps, ...) name
  # 10063 patches this kernel does not carry; each returns as its 12377 port lands.
]

[payload.adt]
chip_id = "8011"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
owned_memory_size = "0xaa000000"

[adt.chosen.bytes]
# The DWC3 register aperture for scripts/native-dwc3-console.c: base 0x0a600000 (the SoC's USB3
# controller) and size 0x100000, little-endian, so the console can map it and be the kernel's
# transport after ExitBootServices.
"unixnu,dwc3-console" = "0000600a000000000000100000000000"
boot-manifest-hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
darwinboot-efi-map = ""

# Note: ephemeral-storage is intentionally NOT set in [adt.chosen.u32] so com.apple.datamigrator
# runs the 4 filtered user-agnostic plugins (including SystemAppMigrator) on first boot after
# sheng-staged-apps=1 populates /private/var/staged_system_apps.

[adt.chosen.u32]
# Force a valid QSCRATCH VBUS/session so the controller enumerates for the host; the console
# requires the aperture above to be exactly 0x0a600000 when this is set.
"unixnu,qcom-usb0" = 1
# Bring-up probe: wait this long after the first PE_init_kprintf serial_init and then reset
# through PSCI, so a boot without a console still reports how far the kernel got. Removed once
# the console or a board driver carries the log.
"unixnu,dwc3-probe-reset-ms" = 8000

[adt.product.string]
model = "xiaomi,sirius"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1                  # no suspend/resume on this board: do not let the CPU park forever

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2                # the non-mechanical answer BSPlatform passes through
