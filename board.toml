# Board description of the Xiaomi Mi 8 SE (sirius, SDM710), read by the unixnu build driver.
#
# Format 2: ARM64, SoC, OS and device layers merge. The OS profile supplies the iPhone restore
# identity and XNU source; the sdm710 SoC profile and dts/sirius.dts supply the hardware.

schema_version = 2

[board]
name = "sirius"
soc = "SDM710"
soc_source = "sdm710"
# The iPhone iOS userland must be lowered offline: SDM710 has no PAC, and the original arm64e
# kexts cannot be prelinked into the ARM64 source kernel.
os_profile = "ios-26.5.2-23F84-arm64"
description = "Xiaomi Mi 8 SE"
kit = "sirius"

# ArmDTPlatform drives the platform expert from dts/sirius.dts. ArmCpu is the board's modified
# copy in drivers/ArmCpu (non-Apple timer INTID, /cpus probe counters, sheng-smp). DarwinBoot is
# the board's fork with the GIC-500 pre-configuration and the INTID 19 timer. XnuPrelink is the
# prelink kit the OS profile names. GopFramebuffer, AppleKeyStoreState and ShengHidInput drive
# the iOS userspace display, keystore state and touch input.
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState", "ShengHidInput"]

# [ipsw] comes from profiles/os/ios-26.5.2-23F84-arm64: iPhone18,2 / v54ap / 23F84.
# The restore identity does not change this board's SDM710/eMMC/GIC/USB hardware.

[kernel]
defconfig = "sirius_ios26_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm710.config", "os:configs/ios.config"]
# arch and OS only: the SoC and device series of the iPadOS 17 port patch xnu-10063 and do not
# apply to xnu-12377. The device adds its own 12377 patches deliberately.
patch_series = ["arch:patches/xnu/series", "os:patches/xnu/series"]
# build-xnu-12377.sh builds and links its own archives; the recipes of the iPadOS 17 port
# below are for the xnu-10063 build.
archives = []

[device_tree]
source = "device:dts/sirius.dts"
include_dirs = ["soc:dts"]

[userdata]
first_lba = 0x1080000              # 17301504
last_lba = 0x747BFDE               # 122142686
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
# trust_cache_sha256 is set once the 23F84 trust caches are extracted and bundled.
volume = "SIRIUSESP"
size_mib = 512                      # holds the kernel, trust cache, EFI binaries and optional 256 MiB RAM Data seed
loader = "payload"                  # not "firmware": unixnu.toml gets [[driver]] Payloads/DarwinBoot.efi
title = "sirius iOS 26.5.2 bring-up: arm64 xnu-12377 kernel"
dram_size = "0x17d6c0000"
panic_screen = true
# Unattended bring-up: after drawing a panic, keep it on screen this long and then reset into
# fastboot (the console writes the PMIC bootloader reason first). Long enough to photograph.
panic_reset = 45
# Bisection step 1: reset 10 s after _arm_init's serial_init returns. serial_init runs the board
# console first, which maps the SPMI windows, so the stub's PMIC marker can run there; a return to
# fastboot therefore proves both the console path and the bootloader reason. A stage-3 stub (reset
# at the MMU enable, before arm_vm_init) cannot map anything and is deliberately not used.
# No artificial stage-4 reset probe: let the kernel run until serial_init or panic_screen.
entry_probe_reset_delay = 0
# No text_fixups until generated against the exact lowered iPhone 23F84 cache.
kernel_args = [
  "-v", "serial=3", "debug=0x14e", "-enable_kprintf_spam", # console on the USB transport, kernel debug mask
  "cpus=8", "sheng-smp=1",                   # ArmCpu claims every /cpus nub
  "armcpu-timer-intid=19",                   # SDM710 virtual timer is GIC PPI 3 (INTID 19)
  "armcpu-self-ipi=1",
  "sirius_emmc_hs=3",                        # BoardStorage eMMC: card clock up to 100 MHz (1 = 25, 2 = 50,
                                             # 3 = 100), each step proven against blocks read at 400 kHz
  "sirius_emmc_win=1",                       # publish the read-only SHNGROOT windows of [userdata] for KDK APFS
  "sirius-allow-unverified=1",               # authorize read-only SHNGROOT window in native_ufs_owner_root_authorized
  "launchdsuffix=release",                   # DEVELOPMENT: exec /sbin/launchd directly and trace its errno
  # The other iPadOS 17 arguments (offline-legacy-*, sheng-staged-apps, sirius-data-write, ...) name
  # 10063 patches or paths this kernel does not carry; each returns as its 12377 port lands.
]

[payload.adt]
# root_match_volume_uuid must come from the lowered iPhone 23F84 root image once written to userdata
# (probed on hardware against the read-only 21H461 SHNGROOT OS window 04769D26-2CA0-4825-B443-E2E5F88300F2).
owned_memory_size = "0xaa000000"

[adt.chosen.bytes]
# The DWC3 register aperture for scripts/native-dwc3-console.c: base 0x0a600000 (the SoC's USB3
# controller) and size 0x100000, little-endian, so the console can map it and be the kernel's
# transport after ExitBootServices.
"unixnu,dwc3-console" = "0000600a000000000000100000000000"
# The kernel's own stage markers (scripts/native-dwc3-console.c paint_stage) draw on this board's
# framebuffer, the aperture DarwinBoot already validated: physical base, width, height, rowbytes.
"unixnu,display" = "0000009c0000000038040000c0080000e0100000"
# boot-manifest-hash is supplied only after verifying the new iPhone root/cache image pair.
darwinboot-efi-map = ""

# Note: ephemeral-storage is intentionally NOT set in [adt.chosen.u32] so com.apple.datamigrator
# runs the 4 filtered user-agnostic plugins (including SystemAppMigrator) on first boot after
# sheng-staged-apps=1 populates /private/var/staged_system_apps.

[adt.chosen.u32]
# Force a valid QSCRATCH VBUS/session so the controller enumerates for the host; the console
# requires the aperture above to be exactly 0x0a600000 when this is set.
"unixnu,qcom-usb0" = 1
# SDM710 leaves USB to board code: power GCC and the QUSB2 PHY, select UTMI as the PIPE clock,
# and install a direct SID 0x740 route in the apps SMMU before the DWC3 is touched.
"unixnu,qcom-usb-board-init" = 1
# A plain PSCI reset is a normal reboot here: the bootloader reads its reason from PM660
# PON_SOFT_RB_SPARE. The console writes the fastboot reason before every reset it performs, so
# bring-up loops come back to fastboot instead of booting the system again.
"unixnu,qcom-reset" = 1

[adt.product.string]
model = "xiaomi,sirius"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1                  # no suspend/resume on this board: do not let the CPU park forever
"kern.maxvnodes" = 98755            # dram_size (0x17d6c0000) / 64 KiB + 1024, preventing lsd first-boot vnode exhaustion

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2                # the non-mechanical answer BSPlatform passes through
